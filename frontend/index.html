<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahti deployment Week 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <header class="p-3 bg-dark text-white">
        <div class="container">
            <h1 class="mt-3">Welcome to full stack deployment</h1>
            <p>This is a full end-to-end application deployed with Docker Compose with separate containers for Nginx frontend, NodeJS backend, and MySQL database.</p>
            <div id="time">Loading...</div>
            <div id="visits">Loading...</div>
            <div id="status">Loading...</div>
        </div>
    </header>
    <section class="container">
        <div class="p-3">
            <h2>Answers</h2>
            <div class="card mt-3 p-3 ">
                <p class=" h5 mt-1"><strong>test</strong></p>
            </div>
        </div>
    </section>     
    <section class="container">
        
        <div class="p-3">
            <h2>Documentation</h2>

            <div class="card mt-3 p-3">
                <p class="h5 mt-1"><strong>test</strong></p>
                <img src="" alt="">
            </div>

        </div>
    </section>    
    <footer>
        <div class="p-3 bg-dark text-white">
            <div class="container">
                <p class="mb-0">Made by Teemu L.</p>
            </div>
        </div>
    </footer>
    <script>
        postVisit()
        getTime()
        getStatus()
        setInterval(getTime,1000)
        setInterval(getVisits,1000)
        function getTime(){
            fetch('/time')
            .then(res => res.json())
            .then(data => { document.getElementById('time').innerText ="Current server time: "+data.time; })
            .catch(err => { document.getElementById('time').innerText = 'API error: ' + err; });
        }
        function getVisits(){
            fetch('/visits')
            .then(res => res.json())
            .then(data => { document.getElementById('visits').innerText ="Visits: "+data.count; })
            .catch(err => { document.getElementById('visits').innerText = 'API error: ' + err; });
        }
        function postVisit(){
            fetch('/visit', {method:"POST"})
            .then(res => res.json())
            .then(data => { document.getElementById('visits').innerText ="Visits: "+data.count; })
            .catch(err => { document.getElementById('visits').innerText = 'API error: ' + err; });
        }
        function getStatus(){
            fetch('/status')
            .then(res => res.json())
            .then(data => { document.getElementById('status').innerText ="Backend status: "+data.status; })
            .catch(err => { document.getElementById('status').innerText = 'API error: ' + err; });
        }
    </script>
</body>
</html>
