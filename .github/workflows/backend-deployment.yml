name: Build and Deploy Backend

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/backend:${{ github.sha }}" >> $GITHUB_ENV

      - name: Build container image
        run: docker build -t "$IMAGE" ./backend

      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: docker push "$IMAGE"

      - uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4"

      - name: Deploy to Rahti
        run: |
          oc login --token=${{ secrets.RAHTI_TOKEN }} --server=${{ secrets.RAHTI_SERVER }}
          oc set image deployment/backend backend="$IMAGE"
